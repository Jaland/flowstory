<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaaS Inference Flow</title>
    <link rel="stylesheet" href="../templates/style.css">
</head>
<body>

<button class="fs-theme-toggle" id="fs-theme">&#9790;</button>

<div class="fs-brand" id="fs-brand"></div>
<div class="fs-title" id="fs-title"></div>

<div class="fs-panel">
  <div class="fs-flow-bar">
    <select id="fs-flow-select"></select>
    <button class="fs-start" id="fs-play">&#9654; Start</button>
    <button id="fs-speed">1x</button>
    <button id="fs-loop" style="border-color:#3fb950;color:#3fb950">&#8635; Loop</button>
    <button class="fs-reset" id="fs-reset">Reset</button>
  </div>
  <div class="fs-steps" id="fs-steps">
    <div class="fs-steps-title">Flow Steps <span style="font-weight:400;font-size:11px;color:var(--fs-text-dim)">· click to jump</span></div>
    <div id="fs-steps-container"></div>
  </div>
  <div class="fs-inspector" id="fs-inspector">
    <div class="fs-inspector-title" id="fs-inspector-title" style="color:var(--fs-accent)">Component</div>
    <div id="fs-inspector-content"></div>
  </div>
</div>

<div id="fs-highlight-box" style="display:none;position:fixed;z-index:350;border-radius:10px;pointer-events:none"></div>
<div id="fs-overlay" style="display:none;position:fixed;top:0;left:0;right:380px;bottom:0;z-index:300;background:rgba(0,0,0,0.6)">
  <div id="fs-overlay-card" style="position:absolute;background:#161b22ee;border:1px solid #30363d;border-radius:14px;max-width:420px;padding:22px 26px;box-shadow:0 12px 40px rgba(0,0,0,0.5)">
    <button id="fs-overlay-close" style="position:absolute;top:10px;right:14px;background:none;border:none;color:#8b949e;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px">✕</button>
    <div id="fs-overlay-accent" style="width:4px;height:24px;border-radius:2px;position:absolute;left:0;top:22px"></div>
    <h2 id="fs-overlay-title" style="margin:0 0 6px;font-size:18px;color:#c9d1d9;font-family:system-ui"></h2>
    <p id="fs-overlay-desc" style="margin:0 0 14px;font-size:13px;color:#8b949e;line-height:1.5;font-family:system-ui"></p>
    <div id="fs-overlay-details" style="font-size:12px;font-family:'SF Mono',Menlo,monospace"></div>
    <button id="fs-overlay-resume" style="margin-top:14px;padding:7px 20px;border:1px solid #3fb950;border-radius:8px;background:transparent;color:#3fb950;font-size:13px;cursor:pointer;font-family:system-ui">&#9654; Resume Flow</button>
  </div>
</div>

<div class="fs-legend" id="fs-legend"></div>

<canvas id="fs-canvas"></canvas>

    <script type="module">
        import { FlowStory } from '../dist/flowstory.min.js';

        (async () => {
        const viz = new FlowStory(document.getElementById('fs-canvas'), {
            stepsContainer: document.getElementById('fs-steps-container'),
            inspectorTitle: document.getElementById('fs-inspector-title'),
            inspectorContent: document.getElementById('fs-inspector-content'),
            overlay: document.getElementById('fs-overlay'),
            overlayCard: document.getElementById('fs-overlay-card'),
            overlayTitle: document.getElementById('fs-overlay-title'),
            overlayDesc: document.getElementById('fs-overlay-desc'),
            overlayDetails: document.getElementById('fs-overlay-details'),
            overlayAccent: document.getElementById('fs-overlay-accent'),
            overlayClose: document.getElementById('fs-overlay-close'),
            overlayResume: document.getElementById('fs-overlay-resume'),
            highlightBox: document.getElementById('fs-highlight-box'),
            brand: document.getElementById('fs-brand'),
            title: document.getElementById('fs-title'),
            legend: document.getElementById('fs-legend'),
            flowSelect: document.getElementById('fs-flow-select'),
            playBtn: document.getElementById('fs-play'),
            speedBtn: document.getElementById('fs-speed'),
            loopBtn: document.getElementById('fs-loop'),
            resetBtn: document.getElementById('fs-reset'),
            themeBtn: document.getElementById('fs-theme'),
        });

        window.__flowstory = viz;

        const diagram = {
            "meta": {
                "title": "MaaS Inference Flow",
                "author": "OpenDataHub MaaS Team"
            },
            "canvas": {
                "width": 1600,
                "height": 950
            },
            "nodes": {
                "cluster": {
                    "x": 180,
                    "y": 50,
                    "w": 1200,
                    "h": 870,
                    "type": "boundary",
                    "label": "Kubernetes Cluster",
                    "color": "#f0883e",
                    "bgColor": "#fff5ed"
                },
                "user": {
                    "x": 20,
                    "y": 400,
                    "w": 120,
                    "h": 80,
                    "type": "icon",
                    "label": "User"
                },
                "maas-boundary": {
                    "x": 220,
                    "y": 100,
                    "w": 1130,
                    "h": 780,
                    "type": "boundary",
                    "label": "Models as a Service",
                    "color": "#1976d2",
                    "bgColor": "#f0f8ff"
                },
                "gateway": {
                    "x": 260,
                    "y": 150,
                    "w": 1050,
                    "h": 100,
                    "type": "box",
                    "label": "Gateway",
                    "sublabel": "Gateway API / HTTPRoute",
                    "color": "#7b1fa2",
                    "fontSize": 18
                },
                "authpolicy": {
                    "x": 420,
                    "y": 310,
                    "w": 280,
                    "h": 100,
                    "type": "box",
                    "label": "MaaSAuthPolicy",
                    "sublabel": "Authorino",
                    "color": "#e65100"
                },
                "subscription": {
                    "x": 800,
                    "y": 310,
                    "w": 280,
                    "h": 100,
                    "type": "box",
                    "label": "MaaSSubscription",
                    "sublabel": "Limitador",
                    "color": "#e65100"
                },
                "maas-api": {
                    "x": 260,
                    "y": 500,
                    "w": 280,
                    "h": 100,
                    "type": "box",
                    "label": "MaaS API",
                    "sublabel": "Key Validation",
                    "color": "#1976d2"
                },
                "inference": {
                    "x": 700,
                    "y": 500,
                    "w": 280,
                    "h": 100,
                    "type": "box",
                    "label": "Inference Service",
                    "sublabel": "KServe / vLLM",
                    "color": "#388e3c"
                },
                "llm": {
                    "x": 1050,
                    "y": 500,
                    "w": 220,
                    "h": 100,
                    "type": "box",
                    "label": "LLM",
                    "sublabel": "Model Runtime",
                    "color": "#388e3c"
                }
            },
            "flows": {
                "happy-path": {
                    "label": "Happy Path - Successful Inference",
                    "steps": [
                        {
                            "text": "1. User sends inference request with API key",
                            "mode": "arrow",
                            "from": "user",
                            "to": "gateway",
                            "num": 1,
                            "color": "#1976d2",
                            "fromRight": true,
                            "toLeft": true,
                            "yOff": -20
                        },
                        {
                            "text": "2. Gateway routes to MaaSAuthPolicy",
                            "mode": "arrow",
                            "from": "gateway",
                            "to": "authpolicy",
                            "num": 2,
                            "color": "#7b1fa2",
                            "fromBottom": true,
                            "toTop": true
                        },
                        {
                            "text": "3. AuthPolicy validates key via MaaS API",
                            "mode": "arrow",
                            "from": "authpolicy",
                            "to": "maas-api",
                            "num": 3,
                            "color": "#e65100",
                            "fromBottom": true,
                            "toTop": true
                        },
                        {
                            "text": "4. Key validated successfully",
                            "mode": "lightup",
                            "target": "maas-api",
                            "badge": "✓",
                            "color": "#3fb950"
                        },
                        {
                            "text": "5. Check rate limits via MaaSSubscription",
                            "mode": "arrow",
                            "from": "authpolicy",
                            "to": "subscription",
                            "num": 5,
                            "color": "#e65100",
                            "fromRight": true,
                            "toLeft": true
                        },
                        {
                            "text": "6. Within limits - proceed",
                            "mode": "lightup",
                            "target": "subscription",
                            "badge": "✓",
                            "color": "#3fb950"
                        },
                        {
                            "text": "7. Request forwarded to Inference Service",
                            "mode": "arrow",
                            "from": "subscription",
                            "to": "inference",
                            "num": 7,
                            "color": "#1976d2",
                            "fromBottom": true,
                            "toBottom": true
                        },
                        {
                            "text": "8. Inference Service forwards to LLM",
                            "mode": "arrow",
                            "from": "inference",
                            "to": "llm",
                            "num": 8,
                            "color": "#388e3c",
                            "fromRight": true,
                            "toLeft": true
                        },
                        {
                            "text": "9. LLM generates completion",
                            "mode": "lightup",
                            "target": "llm",
                            "badge": 9,
                            "color": "#388e3c"
                        },
                        {
                            "text": "10. Completion returned to user",
                            "mode": "arrow",
                            "from": "inference",
                            "to": "user",
                            "num": 10,
                            "color": "#3fb950",
                            "fromLeft": true,
                            "toRight": true,
                            "yOff": 20
                        }
                    ]
                },
                "auth-error": {
                    "label": "Auth Error - Invalid API Key",
                    "steps": [
                        {
                            "text": "1. User sends inference request with API key",
                            "mode": "arrow",
                            "from": "user",
                            "to": "gateway",
                            "num": 1,
                            "color": "#1976d2",
                            "fromRight": true,
                            "toLeft": true,
                            "yOff": -20
                        },
                        {
                            "text": "2. Gateway routes to MaaSAuthPolicy",
                            "mode": "arrow",
                            "from": "gateway",
                            "to": "authpolicy",
                            "num": 2,
                            "color": "#7b1fa2",
                            "fromBottom": true,
                            "toTop": true
                        },
                        {
                            "text": "3. AuthPolicy validates key via MaaS API",
                            "mode": "arrow",
                            "from": "authpolicy",
                            "to": "maas-api",
                            "num": 3,
                            "color": "#e65100",
                            "fromBottom": true,
                            "toTop": true
                        },
                        {
                            "text": "4. Invalid key - validation failed",
                            "mode": "lightup",
                            "target": "maas-api",
                            "badge": "✗",
                            "errColor": "#f85149"
                        },
                        {
                            "text": "5. AuthPolicy rejects request",
                            "mode": "lightup",
                            "target": "authpolicy",
                            "badge": "401",
                            "errColor": "#f85149"
                        },
                        {
                            "text": "6. Error returned to user (401/403)",
                            "mode": "arrow",
                            "from": "authpolicy",
                            "to": "user",
                            "num": 6,
                            "color": "#f85149",
                            "fromLeft": true,
                            "toRight": true,
                            "yOff": 0
                        }
                    ]
                },
                "rate-limit": {
                    "label": "Rate Limit Error - Quota Exceeded",
                    "steps": [
                        {
                            "text": "1. User sends inference request with API key",
                            "mode": "arrow",
                            "from": "user",
                            "to": "gateway",
                            "num": 1,
                            "color": "#1976d2",
                            "fromRight": true,
                            "toLeft": true,
                            "yOff": -20
                        },
                        {
                            "text": "2. Gateway routes to MaaSAuthPolicy",
                            "mode": "arrow",
                            "from": "gateway",
                            "to": "authpolicy",
                            "num": 2,
                            "color": "#7b1fa2",
                            "fromBottom": true,
                            "toTop": true
                        },
                        {
                            "text": "3. AuthPolicy validates key via MaaS API",
                            "mode": "arrow",
                            "from": "authpolicy",
                            "to": "maas-api",
                            "num": 3,
                            "color": "#e65100",
                            "fromBottom": true,
                            "toTop": true
                        },
                        {
                            "text": "4. Key validated successfully",
                            "mode": "lightup",
                            "target": "maas-api",
                            "badge": "✓",
                            "color": "#3fb950"
                        },
                        {
                            "text": "5. Check rate limits via MaaSSubscription",
                            "mode": "arrow",
                            "from": "authpolicy",
                            "to": "subscription",
                            "num": 5,
                            "color": "#e65100",
                            "fromRight": true,
                            "toLeft": true
                        },
                        {
                            "text": "6. Rate limit exceeded",
                            "mode": "lightup",
                            "target": "subscription",
                            "badge": "429",
                            "errColor": "#f85149"
                        },
                        {
                            "text": "7. Too Many Requests returned to user",
                            "mode": "arrow",
                            "from": "subscription",
                            "to": "user",
                            "num": 7,
                            "color": "#f85149",
                            "fromLeft": true,
                            "toRight": true,
                            "yOff": 10
                        }
                    ]
                }
            },
            "flowOrder": ["happy-path", "auth-error", "rate-limit"],
            "defaultFlow": "happy-path",
            "legend": [
                { "label": "Request", "color": "#1976d2" },
                { "label": "Auth/Policy", "color": "#e65100" },
                { "label": "Model Inference", "color": "#388e3c" },
                { "label": "Success Response", "color": "#3fb950" },
                { "label": "Error Response", "color": "#f85149" }
            ]
        };

        // Add tooltips for inspector
        diagram.tooltips = {
            "cluster": {
                "title": "Kubernetes Cluster",
                "description": "OpenShift or upstream Kubernetes cluster hosting the MaaS platform and model serving infrastructure."
            },
            "maas-boundary": {
                "title": "Models as a Service Platform",
                "description": "Kubernetes-native platform for managing inference model endpoints with policy-based auth and rate limiting."
            },
            "user": {
                "title": "User / Client Application",
                "description": "End user or application sending inference requests using their API key."
            },
            "gateway": {
                "title": "Gateway API",
                "description": "Entry point for all traffic. Routes requests and enforces policies using Kubernetes Gateway API."
            },
            "authpolicy": {
                "title": "MaaSAuthPolicy (Authorino)",
                "description": "Validates API keys by querying the MaaS API. Returns 401 for invalid keys or 403 for unauthorized access."
            },
            "subscription": {
                "title": "MaaSSubscription (Limitador)",
                "description": "Enforces token-based rate limits per subscription. Returns 429 Too Many Requests when quota is exceeded."
            },
            "maas-api": {
                "title": "MaaS API Service",
                "description": "Validates API keys by checking hashed keys against the database. Used by Authorino for authentication."
            },
            "inference": {
                "title": "Inference Service",
                "description": "KServe InferenceService that handles model serving requests. Forwards to the LLM runtime (vLLM, TGI, etc)."
            },
            "llm": {
                "title": "LLM Model Runtime",
                "description": "The actual language model runtime (vLLM, Text Generation Inference, etc) that generates completions."
            }
        };

        try {
            await viz.load(diagram);

            // Auto-play with loop on page load
            viz.state.loopMode = true;
            const loopBtn = document.getElementById('fs-loop');
            if (loopBtn) {
                loopBtn.textContent = '⟳ Loop ON';
                loopBtn.style.borderColor = '#3fb950';
                loopBtn.style.color = '#3fb950';
            }
            viz.play();
        } catch (e) {
            console.error('FlowStory load error:', e);
            document.body.innerHTML = `<div style="padding:40px;color:#f85149;font-family:monospace"><h2>FlowStory Load Error</h2><pre>${e.message}\n\n${e.stack || ''}</pre></div>`;
        }
        })();
    </script>
</body>
</html>
